<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS 심리 상태 진단 - 정보 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #f8fafc; padding: 50px 0;">
    <div class="container" style="max-width: 520px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06);">

        <header style="text-align: center; margin-bottom: 28px;">
            <h1 style="font-size: 24px; color: #0f172a; font-weight: 800; margin-bottom: 8px;">🧠 SNS 심리 상태 진단</h1>
            <p style="color: #64748b; font-size: 14px; margin: 0;">진단 리포트 생성을 위해 사용자 정보를 입력해 주세요.</p>
        </header>

        <form id="startForm">
            <!-- 이름 -->
            <div style="margin-bottom: 18px;">
                <label for="userName" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">이름</label>
                <input type="text" id="userName" name="userName" placeholder="홍길동" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box;">
            </div>

            <!-- 연락처 -->
            <div style="margin-bottom: 18px;">
                <label for="userPhone" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">연락처</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="010-1234-5678" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box;">
            </div>

            <!-- 이메일 -->
            <div style="margin-bottom: 18px;">
                <label for="userEmail" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">이메일</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="example@email.com" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box;">
            </div>

            <!-- 성별 -->
            <div style="margin-bottom: 28px;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">성별</label>
                <div style="display: flex; gap: 12px;">
                    <label style="flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; color: #475569;">
                        <input type="radio" name="userGender" value="남성" required style="margin-right: 6px;"> 남성
                    </label>
                    <label style="flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; color: #475569;">
                        <input type="radio" name="userGender" value="여성" required style="margin-right: 6px;"> 여성
                    </label>
                </div>
            </div>

            <button type="submit" style="width: 100%; padding: 16px 0; font-size: 16px; font-weight: 700; color: #ffffff; background-color: #4f46e5; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);">
                🚀 진단 시작하기
            </button>
        </form>

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
