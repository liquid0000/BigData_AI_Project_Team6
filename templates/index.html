<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS 심리 진단 - 사전 정보 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 소셜미디어(SNS) 심리 상태 진단</h1>
            <p class="subtitle">나의 SNS 이용 습관과 마음 건강 상태를 확인해보세요.</p>
        </header>

        <form id="infoForm">
            <div class="form-group">
                <label for="nickname">1. 닉네임</label>
                <input type="text" id="nickname" required placeholder="예: 길동이">
            </div>

            <div class="form-group">
                <label for="phone">2. 연락처 (휴대폰 번호)</label>
                <input type="tel" id="phone" required placeholder="010-1234-5678">
            </div>

            <div class="form-group">
                <label for="email">3. 이메일 주소</label>
                <input type="email" id="email" required placeholder="user@example.com">
                <small class="help-text">※ 입력하신 연락처와 이메일은 60일 재진단 주기 관리 용도로만 활용됩니다.</small>
            </div>

            <div class="form-group">
                <label for="ageGroup">4. 연령대</label>
                <select id="ageGroup" required>
                    <option value="">선택하세요</option>
                    <option value="10대">10대</option>
                    <option value="20대">20대</option>
                    <option value="30대">30대</option>
                    <option value="40대">40대</option>
                    <option value="50대 이상">50대 이상</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gender">5. 성별</label>
                <select id="gender" required>
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                    <option value="기타">기타 / 선택 안 함</option>
                </select>
            </div>

            <div class="notice-box">
                ⚠️ 진단 완료 제출 시점에 데이터가 안전하게 저장되며, 60일 이내 중복 진단은 제한됩니다.
            </div>

            <a href="{{ url_for('survey') }}" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none;">🚀 진단 시작하기</a>
        </form>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
