<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS 사용 습관 진단 - 정보 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 법정대리인 섹션 숨김 클래스 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body style="background-color: #f8fafc; padding: 50px 0;">
    <div class="container" style="max-width: 520px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06);">

        <header style="text-align: center; margin-bottom: 28px;">
            <h1 style="font-size: 24px; color: #0f172a; font-weight: 800; margin-bottom: 8px;">🧠 SNS 사용 습관 진단</h1>
            <p style="color: #64748b; font-size: 14px; margin: 0;">진단 리포트 생성을 위해 사용자 정보를 입력해 주세요.</p>
        </header>

        <form id="startForm">
            <!-- 이름 -->
            <div style="margin-bottom: 18px;">
                <label for="userName" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">이름</label>
                <input type="text" id="userName" name="userName" placeholder="홍길동" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box;">
            </div>

            <!-- 연락처 -->
            <div style="margin-bottom: 18px;">
                <label for="userPhone" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">연락처</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="010-1234-5678" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; box-sizing: border-box;">
            </div>

            <!-- 연령대 선택 -->
            <div style="margin-bottom: 18px;">
                <label for="ageGroup" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">연령대</label>
                <select id="ageGroup" name="ageGroup" required style="width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; box-sizing: border-box; color: #334155;">
                    <option value="">연령대를 선택해 주세요</option>
                    <option value="만 14세 미만">만 14세 미만</option>
                    <option value="만 14세 이상 ~ 만 19세 미만">만 14세 이상 ~ 만 19세 미만</option>
                    <option value="20대">20대</option>
                    <option value="30대">30대</option>
                    <option value="40대">40대</option>
                    <option value="50대 이상">50대 이상</option>
                </select>
            </div>

            <!-- 성별 -->
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">성별</label>
                <div style="display: flex; gap: 12px;">
                    <label style="flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; color: #475569;">
                        <input type="radio" name="userGender" value="남성" required style="margin-right: 6px;"> 남성
                    </label>
                    <label style="flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; color: #475569;">
                        <input type="radio" name="userGender" value="여성" required style="margin-right: 6px;"> 여성
                    </label>
                </div>
            </div>

            <!-- 개인정보 동의 박스 및 체크박스 -->
            <div style="margin-bottom: 24px; padding: 16px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px;">개인정보 수집 및 이용 동의</label>
                <div style="height: 80px; overflow-y: auto; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 12px; color: #64748b; line-height: 1.4; margin-bottom: 10px;">
                    <p style="margin: 0 0 4px 0;"><strong>[개인정보 수집 안내]</strong></p>
                    <p style="margin: 0 0 4px 0;">1. 수집 항목: 이름, 연락처, 연령대, 성별, (14세 미만의 경우) 법정대리인 정보</p>
                    <p style="margin: 0 0 4px 0;">2. 수집 목적: SNS 사용 습관 진단 리포트 제공 및 본인 확인</p>
                    <p style="margin: 0;">3. 보유 기간: 진단 완료 및 서비스 종료 시까지</p>
                </div>
                <label style="display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #334155; cursor: pointer;">
                    <input type="checkbox" id="privacyAgree" required style="margin-right: 8px;"> [필수] 개인정보 수집 및 이용에 동의합니다.
                </label>
            </div>

            <!-- 만 14세 미만 선택 시 동작하는 법정대리인 동의 섹션 (기본 숨김) -->
            <div id="guardianSection" class="hidden" style="margin-bottom: 28px; padding: 18px; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 14px;">
                <h4 style="margin: 0 0 4px 0; font-size: 14px; font-weight: 800; color: #1e40af;">🛡️ 법정대리인(보호자) 동의 및 정보 입력</h4>
                <p style="margin: 0 0 14px 0; font-size: 12px; color: #3b82f6;">만 14세 미만 아동은 관련 법령에 따라 법정대리인의 동의가 필수입니다.</p>

                <div style="margin-bottom: 12px;">
                    <label for="guardianName" style="display: block; font-size: 12px; font-weight: 700; color: #1e3a8a; margin-bottom: 4px;">법정대리인 성명 *</label>
                    <input type="text" id="guardianName" name="guardianName" placeholder="보호자 이름" style="width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid #93c5fd; border-radius: 8px; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label for="guardianPhone" style="display: block; font-size: 12px; font-weight: 700; color: #1e3a8a; margin-bottom: 4px;">법정대리인 연락처 *</label>
                    <input type="tel" id="guardianPhone" name="guardianPhone" placeholder="010-0000-0000" style="width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid #93c5fd; border-radius: 8px; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label for="guardianRelation" style="display: block; font-size: 12px; font-weight: 700; color: #1e3a8a; margin-bottom: 4px;">관계 *</label>
                    <select id="guardianRelation" name="guardianRelation" style="width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid #93c5fd; border-radius: 8px; outline: none; background: #fff; box-sizing: border-box; color: #334155;">
                        <option value="">선택해 주세요</option>
                        <option value="부모">부모</option>
                        <option value="기타 법정대리인">기타 법정대리인</option>
                    </select>
                </div>

                <label style="display: flex; align-items: center; font-size: 12px; font-weight: 600; color: #1e3a8a; cursor: pointer; margin-top: 10px;">
                    <input type="checkbox" id="guardianAgree" style="margin-right: 8px;"> [필수] 본인은 위 아동의 법정대리인으로서 개인정보 수집에 동의합니다.
                </label>
            </div>

            <button type="submit" style="width: 100%; padding: 16px 0; font-size: 16px; font-weight: 700; color: #ffffff; background-color: #4f46e5; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);">
                🚀 진단 시작하기
            </button>
        </form>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ageSelect = document.getElementById('ageGroup');
            const guardianSection = document.getElementById('guardianSection');
            const guardianInputs = [
                document.getElementById('guardianName'),
                document.getElementById('guardianPhone'),
                document.getElementById('guardianRelation'),
                document.getElementById('guardianAgree')
            ];

            // 1. 연령대 선택 변경 시 만 14세 미만 여부에 따라 보호자 동의란 토글
            ageSelect.addEventListener('change', function() {
                if (this.value === '만 14세 미만') {
                    guardianSection.classList.remove('hidden');
                    guardianInputs.forEach(input => input.setAttribute('required', 'true'));
                } else {
                    guardianSection.classList.add('hidden');
                    guardianInputs.forEach(input => {
                        input.removeAttribute('required');
                        if (input.type === 'checkbox') input.checked = false;
                        else input.value = '';
                    });
                }
            });

            // 2. 폼 제출 시 백엔드 API 요청 처리
            document.getElementById('startForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const name = document.getElementById('userName').value;
                const phone = document.getElementById('userPhone').value;
                const ageGroup = document.getElementById('ageGroup').value;
                const gender = document.querySelector('input[name="userGender"]:checked')?.value || '';

                // 기본 요청 데이터 구성 (이메일 항목 제외)
                const payload = {
                    name: name,
                    phone: phone,
                    ageGroup: ageGroup,
                    gender: gender
                };

                // 만 14세 미만일 경우 보호자 정보를 payload에 함께 수집
                if (ageGroup === '만 14세 미만') {
                    payload.guardianInfo = {
                        name: document.getElementById('guardianName').value,
                        phone: document.getElementById('guardianPhone').value,
                        relation: document.getElementById('guardianRelation').value
                    };
                }

                // 백엔드 DB에 유저 등록/조회 요청
                fetch('/api/start-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        sessionStorage.setItem('userInfo', JSON.stringify(data.userInfo));
                        window.location.href = '/survey';
                    }
                })
                .catch(err => console.error('Error:', err));
            });
        });
    </script>
</body>
</html>
